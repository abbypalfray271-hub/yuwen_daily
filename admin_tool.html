<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文每日练 - 契约管理后台</title>
    <style>
        :root { --primary: #007aff; --bg: #0a0a0c; --card: #1c1c1e; --text: #ffffff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
        .admin-panel { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: var(--primary); text-align: center; }
        .section { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px; }
        button { width: 100%; padding: 14px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        #result-area { margin-top: 20px; background: #000; padding: 15px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="admin-panel">
        <h1>📜 契约管理后台 (语文)</h1>
        <div class="section">
            <label>管理员密钥：</label>
            <input type="password" id="admin-key" placeholder="输入 ADMIN_KEY...">
        </div>
        <div class="section">
            <label>批量生成激活码：</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="gen-count" value="10">
                <select id="gen-duration">
                    <option value="7">7天</option>
                    <option value="30">30天</option>
                    <option value="120">120天</option>
                    <option value="365">365天</option>
                </select>
            </div>
            <button onclick="handleGenerate()">生成激活码</button>
        </div>
        <div id="result-area" style="display:none;"></div>
    </div>
    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3005/api' : '/api';
        async function handleGenerate() {
            const key = document.getElementById('admin-key').value;
            const count = document.getElementById('gen-count').value;
            const durationDays = document.getElementById('gen-duration').value;
            const res = await fetch(`${API_BASE}/admin/generate-codes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, count, durationDays })
            });
            const data = await res.json();
            if(data.success) {
                alert('生成成功，批次：' + data.batchId);
                handleList(data.batchId);
            } else { alert('失败：' + data.error); }
        }
        async function handleList(batchId) {
            const key = document.getElementById('admin-key').value;
            const res = await fetch(`${API_BASE}/admin/list-codes?key=${key}&batchId=${batchId}`);
            const codes = await res.json();
            const area = document.getElementById('result-area');
            area.style.display = 'block';
            area.innerHTML = `<h3>批次 ${batchId} 列表:</h3>` + codes.map(c => `<div>${c.code}</div>`).join('');
        }
    </script>
</body>
</html>
